schemaVersion: "2"
kind: mixin
name: box-mount
displayName: Box Mount (two-way folder sync)
description: "Mounts a Box folder into the sandbox and keeps it in two-way sync via Box's box-mount client. OAuth / developer-token auth: set the token with `sbx secret set -g box`. The kit holds no credentials."

# Box API surface the box-mount client talks to. Start with the core hosts and
# widen using `sbx policy log <sandbox>` if a request gets blocked (e.g. the Box
# events long-poll endpoints under *.services.box.net). Note: sbx `*` matches a
# single label only, so the nested realtime endpoints (e.g. 2.realtime.services.box.net)
# need their own *.realtime.services.box.net entry.
permissions:
  network:
    allow:
      - api.box.com          # REST API + OAuth token endpoint
      - upload.box.com       # file uploads
      - dl.boxcloud.com      # file downloads
      - "*.boxcloud.com"     # download redirects (public/dl shards)
      - "*.services.box.net" # realtime events long-poll (two-way sync)
      - "*.realtime.services.box.net" # realtime event endpoints, e.g. 2.realtime.services.box.net (Box->local sync)
      - "*.boxcdn.net"       # sync-engine min-version manifest (cdn07.boxcdn.net/AgentMount.json)

# The real Box token never enters the container. box-mount sends the sentinel
# value as `Authorization: Bearer proxy-managed`; the sbx proxy swaps in the real
# token from `sbx secret set -g box` on outbound requests to the Box hosts below.
credentials:
  - service: box
    description: "Box OAuth / developer access token, injected as the Bearer credential on Box API requests."
    apiKey:
      name: BOX_ACCESS_TOKEN
      inject:
        - domain: api.box.com
          header: Authorization
          format: "Bearer %s"
        - domain: upload.box.com
          header: Authorization
          format: "Bearer %s"
        - domain: dl.boxcloud.com
          header: Authorization
          format: "Bearer %s"

environment:
  variables:
    # Sentinel: replaced by the proxy on outbound Box requests (see credentials).
    BOX_ACCESS_TOKEN: "proxy-managed"

# NOTE: the box-mount binary (~34 MB) is NOT shipped in this kit's files/ — kit file
# injection has a 4 MB message limit, and the binary must match the sbx runtime arch
# (arm64 on Apple Silicon; no emulation). It is baked into a locally-built image
# instead (see Dockerfile / scripts/build-and-load.sh). Run with:
#   sbx run shell --template sbx-box:local --kit ./ .
# This mixin supplies only the Box network policy, credential injection, and the
# agent instructions; it composes onto that prebuilt image.

agentInstructions:
  content: |
    Box Mount: the `box-mount` CLI is installed on PATH (with an `agent-mount`
    alias) and your Box access token is injected by the sbx proxy as the
    `Authorization: Bearer` credential on requests to api.box.com / upload.box.com /
    dl.boxcloud.com. The BOX_ACCESS_TOKEN env var holds the sentinel "proxy-managed",
    NOT the real token.

    Mount a Box folder into a local directory and keep it in two-way sync:

        # <local-dir>: absolute path to sync into
        # <box-id>:    the folder id (the number at the end of the folder URL on box.com; root = 0)
        box-mount mount "/home/agent/workspace/box" "123456789"
        box-mount status
        box-mount unmount "/home/agent/workspace/box"

    Important:
     - Auth is pre-wired through the proxy. Do NOT run `box-mount config` and do
       NOT write ~/.box-mount/box-config.json — that would override the proxy token.
     - OAuth/developer tokens are short-lived. If sync starts failing with auth
       errors, the host must refresh the secret (`sbx secret set box <new-token>`)
       and recreate the sandbox.
     - Avoid atomic-save (temp-file + rename) edits inside the mount; they break Box
       file version history.
